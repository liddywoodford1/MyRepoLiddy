<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>What's for Lunch?</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header>
      <div class="emoji">🍽️</div>
      <h1>What's for Lunch?</h1>
      <p class="subtitle">Cast your vote — pick one!</p>
    </header>

    <div id="voteSection" class="options">
      <button class="vote-btn" data-option="Saj">
        <span class="icon">🫓</span>
        Saj
      </button>
      <button class="vote-btn" data-option="Manoushe">
        <span class="icon">🍕</span>
        Manoushe
      </button>
      <button class="vote-btn" data-option="Falafel">
        <span class="icon">🧆</span>
        Falafel
      </button>
      <button class="vote-btn" data-option="Foul">
        <span class="icon">🥣</span>
        Foul
      </button>
    </div>

    <p id="status" class="status"></p>

    <div id="votedSection" class="voted-card" hidden>
      <div class="checkmark">✅</div>
      <p>You voted for <strong id="votedOption"></strong></p>
      <a class="btn-link" href="results.html">See results</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="supabaseClient.js"></script>
  <script src="app.js"></script>
</body>
</html>
